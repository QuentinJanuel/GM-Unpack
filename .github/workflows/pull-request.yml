name: Pull request

# Checks every pull request: build, types and tests. Nothing is published from here: releases are
# started by hand (release.yml).
on: pull_request

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tests and their types import the built dist/.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
